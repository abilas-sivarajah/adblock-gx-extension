<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>AdBlock GX</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
    <img src="icons/icon32.png" alt="">
    <h1>AdBlock <span>GX</span></h1>
</header>

<button id="power" class="power card" type="button" aria-pressed="true">
    <span class="label">
        <span class="title" id="powerTitle">Schutz an</span>
        <span class="sub" id="powerSub">Werbung und Tracker werden blockiert</span>
    </span>
    <span class="switch" aria-hidden="true"></span>
</button>

<section class="card" id="siteCard">
    <div class="site-head">
        <div class="site-name">
            <h2>Diese Seite</h2>
            <div class="site" id="site">–</div>
        </div>
        <div class="stat" title="Von Chrome gezählte blockierte Anfragen auf diesem Tab">
            <span class="num" id="blocked">0</span>
            <span class="what">blockiert</span>
        </div>
    </div>
    <ul class="status hidden" id="siteStatus"></ul>
    <button id="exception" class="row" type="button" aria-pressed="false">
        <span class="label"><b>Ausnahme</b><small>auf dieser Seite nichts blockieren</small></span>
        <span class="switch off" aria-hidden="true"></span>
    </button>
    <div class="note hidden" id="reloadNote">Seite wird neu geladen …</div>
</section>

<details class="card" id="discordCard">
    <summary><h2>Discord-Stream-Modus</h2><span class="pill" id="gpuPill">…</span></summary>
    <p class="small" id="gpuText"></p>
    <button id="gpuSettings" class="action" type="button">Hardware-Beschleunigung aus</button>
    <ol class="steps small" id="gpuSteps"></ol>
    <p class="small muted" id="batNote">Alternative: <b>start_opera_discord.bat</b></p>
    <button id="discordHint" class="row" type="button" aria-pressed="true">
        <span class="label"><b>Hinweis auf Netflix &amp; Co.</b></span>
        <span class="switch" aria-hidden="true"></span>
    </button>
</details>

<details class="card" id="listsCard">
    <summary><h2>Filterlisten</h2><span class="pill" id="listsPill"></span></summary>
    <div id="lists"></div>
</details>

<div class="error small hidden" id="error"></div>
<footer>AdBlock Browser GX · Erweiterung</footer>
<script src="gpu.js"></script>
<script src="popup.js"></script>
</body>
</html>
